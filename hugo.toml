baseURL = 'https://tomr.au/'
languageCode = 'en-us'
title = "tomr.au"

[taxonomies]
tag = 'tags'

[params]
# Used for <meta name="description"> and as the footer's left-hand line.
description = "A messy cocktail of my random thoughts"
# Footer, right-hand side.
colophon = "hugo · netlify"
# Fallback when a visitor has never chosen a theme and expresses no
# prefers-color-scheme preference.
defaultTheme = "dark"

# --- Home -------------------------------------------------------------------
[params.home]
# Shown in the header breadcrumb on the home page only.
crumb = "thomas rückstieß"
# The hero renders heroLines in the primary text colour, then heroDim muted.
heroLines = ["Researcher, builder,", "thinker, hot tub"]
heroDim = "philosopher."
bio = ""

# --- Posts ------------------------------------------------------------------
[params.posts]
dek = "My occasional musings."

# --- Tags -------------------------------------------------------------------
[params.tags]
dek = "What I keep coming back to."

# --- About ------------------------------------------------------------------
# Facts rail on /about. Set accent = true to render the value in the accent colour.
[[params.about.facts]]
label = "based in"
value = "melbourne, au"

[[params.about.facts]]
label = "phd"
value = "tum, munich"

[[params.about.facts]]
label = "field"
value = "machine learning"

[[params.about.facts]]
label = "status"
value = "open to ideas"
accent = true

# --- Navigation -------------------------------------------------------------
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts/"

[[params.menu]]
name = "tags"
url = "/tags/"

[[params.menu]]
name = "about"
url = "/about/"

# --- Social -----------------------------------------------------------------
[[params.social]]
name = "github"
url = "https://github.com/rueckstiess"

[[params.social]]
name = "x"
url = "https://x.com/tomonezero"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/rueckstiess/"

[[params.social]]
name = "scholar"
url = "https://scholar.google.com/citations?hl=en&user=dRIgADIAAAAJ"


# --- Markup -----------------------------------------------------------------
[markup]
[markup.highlight]
# Class-based output so a single build can serve both themes; the colour maps
# live in assets/css/chroma.css.
noClasses = false
codeFences = true
guessSyntax = false
lineNos = false
tabWidth = 2

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[markup.goldmark.renderer]
unsafe = true

[services]
  [services.googleAnalytics]
    id = 'G-HSWQQJ99X1'
    disable = false
    respectDoNotTrack = false
